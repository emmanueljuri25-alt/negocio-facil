<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Gestión Comercial{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <a href="{{ url_for('dashboard') }}">
        <i class="fa-solid fa-store"></i>
        <span>Mi Negocio</span>
      </a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Menú">
      <i class="fa-solid fa-bars"></i>
    </button>
    <ul class="nav-links" id="navLinks">
      <li>
        <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
          <i class="fa-solid fa-gauge"></i> Panel
        </a>
      </li>
      <li>
        <a href="{{ url_for('customers') }}" class="{% if 'customer' in request.endpoint %}active{% endif %}">
          <i class="fa-solid fa-users"></i> Clientes
        </a>
      </li>
      <li>
        <a href="{{ url_for('debts') }}" class="{% if 'debt' in request.endpoint %}active{% endif %}">
          <i class="fa-solid fa-file-invoice-dollar"></i> Deudas
        </a>
      </li>
      <li>
        <a href="{{ url_for('inventory') }}" class="{% if 'product' in request.endpoint or request.endpoint == 'inventory' %}active{% endif %}">
          <i class="fa-solid fa-boxes-stacked"></i> Inventario
        </a>
      </li>
      <li>
        <a href="{{ url_for('sales') }}" class="{% if 'sale' in request.endpoint %}active{% endif %}">
          <i class="fa-solid fa-cash-register"></i> Ventas
        </a>
      </li>
    </ul>
  </nav>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">
              <i class="fa-solid {% if category == 'success' %}fa-circle-check{% elif category == 'info' %}fa-circle-info{% else %}fa-triangle-exclamation{% endif %}"></i>
              {{ message }}
              <button class="flash-close" onclick="this.parentElement.remove()">×</button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
